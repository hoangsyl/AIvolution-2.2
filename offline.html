<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIvolution 2.0 — Ngoại tuyến</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #071315;
      color: #ecfeff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #0e2024;
      border: 1px solid rgba(45, 212, 191, 0.25);
      border-radius: 20px;
      padding: 28px 22px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #2dd4bf; }
    p { margin: 0 0 18px; color: #94b8bd; font-size: 14px; line-height: 1.5; }
    button {
      border: none;
      background: #0d9488;
      color: #fff;
      font-weight: 700;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AIvolution 2.0</h1>
    <p>Thiết bị đang mất kết nối Internet. Các tính năng AI trực tuyến cần mạng để hoạt động, bạn có thể thử tải lại ngay khi có kết nối.</p>
    <button type="button" onclick="window.location.reload()">Thử kết nối lại</button>
  </div>
</body>
</html>
